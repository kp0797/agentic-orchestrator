<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Agentic SDLC</title>
    <style>
        :root { --ink:#1d2330; --muted:#5b6475; --line:#d9dee7; --bg:#f7f8fa; --ok:#1d7a46; --bad:#b42318; --warn:#9a6700; --accent:#2c5fd6; }
        * { box-sizing: border-box; }
        body { margin:0; font:14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:var(--bg); }
        header { background:#fff; border-bottom:1px solid var(--line); padding:12px 24px; display:flex; gap:16px; align-items:baseline; }
        header a { color:var(--ink); text-decoration:none; font-weight:600; }
        main { max-width:1200px; margin:0 auto; padding:24px; }
        h1 { font-size:20px; margin:0 0 4px; } h2 { font-size:16px; margin:28px 0 8px; }
        .muted { color:var(--muted); } .mono { font-family: ui-monospace, Menlo, monospace; font-size:12.5px; }
        table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); }
        th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
        th { font-weight:600; background:#fbfcfd; }
        tr.bad td { color:var(--bad); } tr.warn td { color:var(--warn); } tr.ok td { color:var(--ok); }
        .pill { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; font-weight:600; background:#eef1f6; }
        .SUCCEEDED, .VALID { background:#e3f4ea; color:var(--ok); } .FAILED, .STOPPED, .ROLLED_BACK, .BROKEN { background:#fde8e6; color:var(--bad); }
        .AWAITING_APPROVAL, .PAUSED_FOR_APPROVAL, .RETRYING { background:#fff4d6; color:var(--warn); }
        .RUNNING, .VERIFYING { background:#e6eefc; color:var(--accent); }
        .flash { background:#fff; border-left:4px solid var(--accent); padding:10px 14px; margin-bottom:16px; }
        .card { background:#fff; border:1px solid var(--line); padding:16px; margin:12px 0; }
        pre { background:#0f1420; color:#e6e9ef; padding:12px; overflow:auto; max-height:520px; font-size:12.5px; }
        button { font:inherit; padding:6px 14px; border:1px solid var(--line); background:#fff; cursor:pointer; border-radius:4px; }
        button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
        button.danger { color:var(--bad); }
        input, textarea { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:4px; width:100%; }
        .row { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; } .row > * { flex:1; min-width:180px; }
        @media (max-width: 700px) { main { padding:12px; } th:nth-child(n+5), td:nth-child(n+5) { display:none; } }
    </style>
</head>
<body>
<header th:fragment="header">
    <a href="/">Agentic SDLC console</a>
    <span class="muted">Agents propose, gates dispose.</span>
</header>
</body>
</html>
