# Everything runs in Docker; the only prerequisite is Docker itself.
#   docker compose run --rm demo            engine demo with fake agents (no LLM, no API key)
#   docker compose run --rm smoke           pipeline-smoke scenario, replayed, approvals automatic
#   docker compose run --rm brownfield      fix a production bug in a released shortener, replayed (1–2 min of run time)
#   docker compose run --rm ambiguous       unclear request: questions answered, scope changed mid-run, re-planned
#   docker compose run --rm eval            all three scenarios 3 times each: reliability summary in runs/eval-*/
#   docker compose --profile shortener --profile observability up console shortener prometheus
#                                           metrics and alert rules on http://localhost:9090
#   docker compose up console               approval console on http://localhost:8080 (replay mode)
#   docker compose --profile live run --rm ping   one tiny live call to check the provider, key and model
#   docker compose --profile live run --rm eval-live   eval with real models (see docs/LLM_AND_RUNTIME.md)
#   docker compose run --rm test            full test suite, output also saved to build.log
#   docker compose run --rm test-docker     adds Testcontainers tests (uses the host Docker socket)
#   docker compose run --rm test-scenarios  adds whole-scenario tests (slow: several full builds each)
#   docker compose --profile shortener up shortener   the URL shortener on http://localhost:8081 (Postgres + Redis)
x-orchestrator: &orchestrator
  build: .
  volumes:
    - ./runs:/app/runs
    # Scenarios are mounted so recorded cassettes land in the repository, not inside the container.
    - ./scenarios:/app/scenarios
    # The real service, read-only: scenarios copy it into their own workspace and never change it here.
    - ./shortener:/app/shortener:ro
    # Shared Maven cache: agents' code is built with the same dependencies offline when possible.
    - ./.m2:/app/.m2
  environment:
    AGENTIC_MODE: ${AGENTIC_MODE:-replay}
    # "postgres" keeps the audit log in the postgres service: SPRING_PROFILES_ACTIVE=postgres docker compose up postgres console
    SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    # true: agents' Maven builds use only the cached ./.m2 (no downloads)
    AGENTIC_MVN_OFFLINE: ${AGENTIC_MVN_OFFLINE:-false}

services:
  demo:
    <<: *orchestrator
    command: ["fake-demo"]

  smoke:
    <<: *orchestrator
    command: ["run", "pipeline-smoke", "--auto-approve"]

  brownfield:
    <<: *orchestrator
    command: ["run", "brownfield", "--auto-approve"]

  ambiguous:
    <<: *orchestrator
    command: ["run", "ambiguous", "--auto-approve"]

  eval:
    <<: *orchestrator
    command: ["eval", "pipeline-smoke,brownfield,ambiguous", "--runs", "3"]

  console:
    <<: *orchestrator
    command: ["serve"]
    ports:
      - "8080:8080"

  # Live and record modes call the configured provider; see docs/LLM_AND_RUNTIME.md.
  console-live:
    <<: *orchestrator
    command: ["serve"]
    ports:
      - "8080:8080"
    environment: &live-env
      AGENTIC_MODE: ${AGENTIC_MODE:-record}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      AGENTIC_MVN_OFFLINE: ${AGENTIC_MVN_OFFLINE:-false}
      # Provider: anthropic (default) or openai-compatible (OpenAI, Ollama, vLLM, LM Studio, gateways).
      AGENTIC_LLM_PROVIDER: ${AGENTIC_LLM_PROVIDER:-anthropic}
      # A local server on your machine is http://host.docker.internal:<port>/v1 from inside Docker.
      AGENTIC_LLM_BASE_URL: ${AGENTIC_LLM_BASE_URL:-}
      AGENTIC_LLM_MODEL: ${AGENTIC_LLM_MODEL:-}
      # Per-agent model ids; empty means the agent's default from application.yml.
      AGENTIC_MODELS_REQUIREMENTS_MODEL: ${AGENTIC_MODELS_REQUIREMENTS_MODEL:-}
      AGENTIC_MODELS_PLANNER_MODEL: ${AGENTIC_MODELS_PLANNER_MODEL:-}
      AGENTIC_MODELS_ARCHITECT_MODEL: ${AGENTIC_MODELS_ARCHITECT_MODEL:-}
      AGENTIC_MODELS_CODER_MODEL: ${AGENTIC_MODELS_CODER_MODEL:-}
      AGENTIC_MODELS_TESTER_MODEL: ${AGENTIC_MODELS_TESTER_MODEL:-}
      AGENTIC_MODELS_DOCS_MODEL: ${AGENTIC_MODELS_DOCS_MODEL:-}
      AGENTIC_LLM_TOKEN_PARAM: ${AGENTIC_LLM_TOKEN_PARAM:-max_tokens}
      # Keys are passed through from your shell and never stored.
      AGENTIC_LLM_API_KEY: ${AGENTIC_LLM_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    profiles: ["live"]

  ping:
    <<: *orchestrator
    command: ["ping-model"]
    environment: *live-env
    profiles: ["live"]

  # Reliability with real models: docker compose --profile live run --rm eval-live [eval <scenarios> --runs N]
  eval-live:
    <<: *orchestrator
    command: ["eval", "pipeline-smoke", "--runs", "3"]
    environment:
      <<: *live-env
      AGENTIC_MODE: live
    profiles: ["live"]

  test:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /workspace
    volumes:
      - .:/workspace
      # Build output stays inside Docker: on a synced folder (iCloud Desktop, OneDrive) sync clients copy
      # files while Maven writes them and leave unreadable "File 2.class" duplicates that break builds.
      - orchestrator-target:/workspace/orchestrator/target
      - shortener-target:/workspace/shortener/target
    # Dependency cache lives in ./.m2 (gitignored) so it survives between runs and can be reused offline.
    entrypoint: ["bash", "-c", "set -o pipefail; mvn -B -Dmaven.repo.local=/workspace/.m2/repository verify 2>&1 | tee build.log"]

  test-docker:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /workspace
    volumes:
      - .:/workspace
      - orchestrator-target:/workspace/orchestrator/target
      - shortener-target:/workspace/shortener/target
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    entrypoint: ["bash", "-c", "set -o pipefail; mvn -B -Dmaven.repo.local=/workspace/.m2/repository verify -Ddocker=true 2>&1 | tee build.log"]

  test-scenarios:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /workspace
    volumes:
      - .:/workspace
      - orchestrator-target:/workspace/orchestrator/target
      - shortener-target:/workspace/shortener/target
    entrypoint: ["bash", "-c", "set -o pipefail; mvn -B -Dmaven.repo.local=/workspace/.m2/repository verify -Dscenarios=true 2>&1 | tee build.log"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentic
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic
    ports:
      - "5432:5432"

  # --- The URL shortener (v1), with its own database and Redis ---
  shortener:
    build:
      context: .
      target: shortener
    environment:
      DB_URL: jdbc:postgresql://shortener-db:5432/shortener
      DB_USER: shortener
      DB_PASSWORD: shortener
      REDIS_HOST: redis
      BASE_URL: http://localhost:8081
      RATE_LIMIT: ${RATE_LIMIT:-20}
      # Latency histograms for Prometheus (p99 redirect alert in ops/prometheus/alerts.yml). Set as JSON
      # because the property name has a dash that environment-variable names cannot express.
      SPRING_APPLICATION_JSON: '{"management":{"metrics":{"distribution":{"percentiles-histogram":{"http.server.requests":true}}}}}'
    ports:
      - "8081:8081"
    depends_on:
      shortener-db:
        condition: service_healthy
      redis:
        condition: service_started
    profiles: ["shortener"]

  shortener-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener"]
      interval: 2s
      retries: 15
    profiles: ["shortener"]

  redis:
    image: redis:7-alpine
    profiles: ["shortener"]

  # --- Observability: Prometheus scraping the console (/metrics) and the shortener (/actuator/prometheus) ---
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
    profiles: ["observability"]

volumes:
  orchestrator-target:
  shortener-target:
