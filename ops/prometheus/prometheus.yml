# Scrapes the orchestrator console and the shortener. Start with:
#   docker compose --profile shortener --profile observability up console shortener prometheus
# then open http://localhost:9090 (try: agentic_gate_evaluations_total, shortener_clicks_dropped_total).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: orchestrator
    metrics_path: /metrics
    static_configs:
      - targets: ["console:8080"]
  - job_name: shortener
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["shortener:8081"]
