spring:
  application:
    name: agentic-orchestrator
  main:
    banner-mode: off
  # By default the audit log is kept in memory. The 'postgres' profile stores it in PostgreSQL (Flyway creates
  # the table); artifacts stay in memory and are written to each run's evidence pack.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

logging:
  level:
    root: warn

server:
  port: 8080

agentic:
  # replay: recorded answers only (no key, no network). live: real calls. record: real calls, saved.
  mode: ${AGENTIC_MODE:replay}
  runs-dir: ${AGENTIC_RUNS_DIR:runs}
  policies-dir: ${AGENTIC_POLICIES_DIR:policies}
  scenarios-dir: ${AGENTIC_SCENARIOS_DIR:scenarios}
  maven-offline: ${AGENTIC_MVN_OFFLINE:false}
  max-parallel: 4
  # Live provider (live and record modes only; replay never calls a model). Keys come from the environment
  # only: AGENTIC_LLM_API_KEY, or ANTHROPIC_API_KEY / OPENAI_API_KEY.
  llm:
    provider: ${AGENTIC_LLM_PROVIDER:anthropic}        # anthropic | openai-compatible
    base-url: ${AGENTIC_LLM_BASE_URL:}                 # openai-compatible: e.g. https://api.openai.com/v1, http://localhost:11434/v1
    model: ${AGENTIC_LLM_MODEL:}                       # optional: one model id for every agent
    token-param: ${AGENTIC_LLM_TOKEN_PARAM:max_tokens} # openai-compatible: max_tokens | max_completion_tokens
  # Model per agent: ids the configured provider understands. These defaults are the ids the committed
  # cassettes were made with. Changing one changes the request keys, so recorded cassettes must be re-recorded.
  # Output caps include the model's thinking, so code-writing agents need generous caps.
  # No temperature by default: some models reject it. Add 'temperature: x' only for models that accept it.
  models:
    requirements: { model: claude-sonnet-5-5, max-tokens: 16000 }
    planner:      { model: claude-opus-5-5,   max-tokens: 16000 }
    architect:    { model: claude-opus-5-5,   max-tokens: 32000 }
    coder:        { model: claude-opus-5-5,   max-tokens: 32000 }
    tester:       { model: claude-sonnet-5-5, max-tokens: 32000 }
    docs:         { model: claude-haiku-5-5,  max-tokens: 8192 }
  # USD per million tokens (input / output), list prices as of October 2026. Add an entry for any other
  # model to have its cost reported and the cost budget enforced; without one its cost shows as $0.
  prices:
    claude-haiku-5-5:  { input-per-m-tok: 0.10, output-per-m-tok: 0.50 }
    claude-sonnet-5-5: { input-per-m-tok: 2.0,  output-per-m-tok: 10.0 }
    claude-opus-5-5:   { input-per-m-tok: 4.0,  output-per-m-tok: 20.0 }
    claude-fable-5-1:  { input-per-m-tok: 10.0, output-per-m-tok: 50.0 }

---
spring:
  config:
    activate:
      on-profile: postgres
  autoconfigure:
    exclude: []
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/agentic}
    username: ${DB_USER:agentic}
    password: ${DB_PASSWORD:agentic}
